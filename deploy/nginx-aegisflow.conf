# deploy/nginx-aegisflow.conf  --  DRAFT for review (Phase 2). NOT installed.
#
# Phase 3 install target:  /etc/nginx/sites-available/aegisflow
#   sudo cp deploy/nginx-aegisflow.conf /etc/nginx/sites-available/aegisflow
#   sudo ln -s /etc/nginx/sites-available/aegisflow /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default        # drop the distro default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ---------------------------------------------------------------------------
# PLACEHOLDER DOMAIN -- same status as the Windows agent's base_url
# placeholder ("https://aegisflow.example.org", see endpoint_agent/
# config.example.toml). Swap every occurrence of:
#
#       AEGISFLOW_DOMAIN_PLACEHOLDER
#
# for the real Vincy Connect domain once it is finalized. Nothing here works
# until that is done and DNS A/AAAA records point at the VPS.
# ---------------------------------------------------------------------------
#
# TLS: this file is intentionally HTTP-only (listen 80) right now. After it
# is installed and DNS resolves, run:
#
#       sudo certbot --nginx -d AEGISFLOW_DOMAIN_PLACEHOLDER
#
# certbot edits THIS file in place: it adds a `listen 443 ssl` server block
# with ssl_certificate / ssl_certificate_key lines and rewrites the port-80
# server into an HTTP->HTTPS redirect (keeping the ACME challenge location
# below reachable). Do not hand-write the 443 block -- leave it for certbot
# so `certbot renew` keeps managing it.

upstream aegisflow_gunicorn {
    # MUST match RuntimeDirectory + --bind in deploy/aegisflow.service
    server unix:/run/aegisflow/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name AEGISFLOW_DOMAIN_PLACEHOLDER;

    # certbot HTTP-01 challenge -- must stay served over plain HTTP even
    # after the redirect is added. certbot's webroot default is /var/www/html;
    # this uses a dedicated dir (create it in Phase 3: mkdir -p /var/www/certbot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Log-file uploads (apps/log_intake). Nginx default is 1m, too small.
    # Django itself sets no hard cap; keep this generous but bounded.
    client_max_body_size 25m;

    # Static files: served straight off disk by Nginx from Django's
    # STATIC_ROOT. Populated by `python manage.py collectstatic` during each
    # deploy. This is why the app has NO WhiteNoise dependency.
    location /static/ {
        alias /opt/aegisflow/app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # NOTE: no /media/ block on purpose. User uploads and generated exports
    # (PRIVATE_UPLOAD_ROOT / PRIVATE_EXPORT_ROOT) are served only through
    # authenticated Django views, never directly off disk.

    location / {
        proxy_pass http://aegisflow_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
