# deploy/nginx-aegisflow.conf
#
# Mirrors the site actually installed on the VincyPros VPS at
# /etc/nginx/sites-available/aegisflow (symlinked from sites-enabled/) as of
# 2026-09-06. Kept identical to the installed file below the header -- if you
# change one, change the other (or re-copy):
#
#   sudo cp deploy/nginx-aegisflow.conf /etc/nginx/sites-available/aegisflow
#   sudo nginx -t && sudo systemctl reload nginx
#
# gunicorn runs on TCP 127.0.0.1:8001 (home-directory layout; see
# deploy/aegisflow.service), proxied directly -- there is no `upstream`
# block. The `# managed by Certbot` lines (the 443 server, the cert paths,
# and the port-80 -> 443 redirect server) were added by `certbot --nginx`
# and are maintained by `certbot renew`; do not hand-edit them.

server {

    server_name aegisflow.vincypros.com;

    client_max_body_size 25m;

    location /static/ {
        alias /home/aegisflow/app/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aegisflow.vincypros.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aegisflow.vincypros.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = aegisflow.vincypros.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name aegisflow.vincypros.com;
    return 404; # managed by Certbot


}
